[project]
name = "vroid-mcp"
version = "0.1.0"
description = "MCP server that drives VRoid Studio on Windows by looking at the window and using mouse/keyboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "vroid-mcp contributors" }]
keywords = ["mcp", "vroid", "vrm", "automation", "windows", "claude"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "mcp>=2.3,<3",
  "pillow>=10",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pyyaml>=6",
  "pywinauto>=0.6.8; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
  "windows-capture>=2.0; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Topogamer0/vroid-mcp"
Issues = "https://github.com/Topogamer0/vroid-mcp/issues"

[project.scripts]
vroid-mcp = "vroid_mcp.server:main"
vroid-calibrate = "vroid_mcp.calibrate:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vroid_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
